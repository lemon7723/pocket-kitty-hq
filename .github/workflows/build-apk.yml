name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确保抠图模型存在
        run: |
          mkdir -p android/app/src/main/assets
          if [ ! -f "android/app/src/main/assets/u2net.tflite" ]; then
            echo "u2net.tflite（全量版 84MB）缺失，自动下载补齐..."
            curl -sL -o android/app/src/main/assets/u2net.tflite \
              "https://huggingface.co/abhimanyu666/u2nettflite/resolve/main/u2net.tflite"
          fi
          echo "模型就位："
          ls -la android/app/src/main/assets/

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5

      - name: 生成缺失的工程文件
        run: flutter create . --org com.pocketkitty --project-name pocket_kitty --platforms android

      - name: 拉取依赖
        run: flutter pub get

      - name: 打包 APK
        run: flutter build apk --release

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: pocket-kitty-apk
          path: build/app/outputs/flutter-apk/app-release.apk
